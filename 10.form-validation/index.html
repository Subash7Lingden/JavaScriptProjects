<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <script src="script.js" defer></script>
    <title>Form Validation</title>
</head>
<body>
    <div class="container">

        <div class="content">
            <div class="logo">
                <img src="images/logo.svg" alt="">
            </div>
            <div class="image"></div>
            <div class="text">
                Start for free & get <br />
                attractive offers today!
            </div>
        </div>

       <form  id="form">

        <div class="social">
            <div class="title">Get Started</div>
            <div class="question">
                Already have an Account? <br />
                <span>Sign In</span>
            </div>
            <div class="btn">
                <div class="btn-1">
                    <img src="https://img.icons8.com/?size=30&id=17949&format=png&color=000000" />
                    Sign Up
                </div>
                <div class="btn-2">
                    <img src="https://img.icons8.com/?size=30&id=uLWV5A9vXIPu&format=png&color=ffffff" />
                    Sign Up
                </div>
            </div>
            <div class="or">Or</div>
        </div>


        
        <!-- /**
         * ! user name input here
         **/-->
        <div>
            <label for="username">User Name</label>
            <i class="fa-slab-duo fa-regular fa-user"></i>
            <input type="text" name="username" id="username" placeholder="Subash Lingden">
            <i class="fas fa-circle-exclamation failure-icon"></i>
            <i class="far fa-check-circle success-icon"></i>
            <div class="error"></div>
        </div>
        <!-- /**
         * ! email input here
         **/-->
        <div>
             <label for="email">Email</label>
            <i class="fa-solid fa-envelope"></i>
            <input type="text" name="email" id="email" placeholder="abc@gmail.com">
            <i class="fas fa-circle-exclamation failure-icon"></i>
            <i class="far fa-check-circle success-icon"></i>
            <div class="error"></div>
        </div>
        <!-- /**
         * ! password input here
         **/-->
        <div>
             <label for="password">Password</label>
            <i class="fa-notdog fa-solid fa-lock"></i>
            <input type="text" name="password" id="password" placeholder="Password here">
            <i class="fas fa-circle-exclamation failure-icon"></i>
            <i class="far fa-check-circle success-icon"></i>
            <div class="error"></div>
        </div>

      <button type="submit" id="submit">Submit</button>
       </form>   
    </div>
</body>
</html>
