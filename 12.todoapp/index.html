<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- BootStrap -->
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <title>Todo App</title>
    <link rel="stylesheet" href="style.css">
    <script src="main.js" defer></script>
</head>
<body>
    <div class="app">
        <h4 class="mb-3">TODO App</h4>

        <div id="addNew" data-bs-toggle="modal"
        data-bs-target="#form">
            <span>Add New Task</span>
            <i class="fa-solid fa-plus"></i>
        </div>

        <h5 class="text-center my-3">Tasks</h5>

        <!-- bootstrap modal -->

         <form class="modal fade" id="form" tabindex="-1">

            <div class="modal-dialog">

                <div class="modal-content">

                <!-- Modal Header -->
                <div class="modal-header">
                    <h5 class="modal-title">Add New Task</h5>

                    <button type="button"
                        class="btn-close"
                        data-bs-dismiss="modal">
                    </button>
                </div>

                <!-- Modal Body -->
                <div class="modal-body">
                    <p>Task Title</p>
                    <input class="form-control" type="text" name="" id="textInput">
                    <div id="msg"></div>
                    <br>
                    <p>Date</p>
                    <input class="form-control" type="date" name="" id="dateInput">
                    <br>
                    <p>Description</p>
                    <textarea class="form-control" name="" id="textArea" cols="30" rows="5"></textarea>
                </div>

                <!-- Modal Footer -->
                <div class="modal-footer">
                    <button type="button"
                        class="btn btn-secondary"
                        data-bs-dismiss="modal">
                        Close
                        </button>

                        <button type="submit" id="add" class="btn btn-success">
                            Add
                        </button>
                    </div>

                </div>
            </div>
        </form>

        <div id="tasks">
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
